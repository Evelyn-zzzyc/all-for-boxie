<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boxie · 健康记录</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>健康记录</h1>
  <nav>
    <a href="index.html">主页</a>
    <a href="weight.html">体重</a>
    <a href="health.html" class="active">健康</a>
    <a href="expenses.html">消费</a>
  </nav>
</header>

<main>
  <!-- 最近健康事件摘要 -->
  <section class="card">
    <h3>💊 最近健康事件</h3>
    <p class="highlight">
      <span id="healthSummary">加载中…</span><br/>
      <span id="healthDate" class="muted"></span>
    </p>
  </section>

  <!-- 时间轴 -->
  <section class="card">
    <h3>时间轴（最近）</h3>
    <ul id="timeline"></ul>
  </section>

  <!-- 驱虫 / 疫苗 / 绝育 -->
  <section class="card">
    <h3>驱虫 / 疫苗 / 绝育</h3>
    <div class="grid">
      <div>
        <h4>驱虫</h4>
        <table id="deworm">
          <thead>
            <tr><th>日期</th><th>药品</th><th>备注</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div>
        <h4>疫苗</h4>
        <table id="vacc">
          <thead>
            <tr><th>日期</th><th>种类</th><th>医院</th><th>备注</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div>
        <h4>绝育</h4>
        <table id="neuter">
          <thead>
            <tr><th>日期</th><th>医院</th><th>备注</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer>更新方式：修改 data/health.json 并提交推送</footer>

<script type="module" src="./js/health.js"></script>
</body>
</html>
